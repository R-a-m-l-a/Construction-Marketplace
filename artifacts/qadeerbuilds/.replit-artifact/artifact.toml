kind = "web"
previewPath = "/"
title = "QadeerBuilds"
description = "A free-first construction discovery platform for finding materials, suppliers, and trusted professionals across Pakistan."
version = "1.0.0"
id = "artifacts/qadeerbuilds"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20671

[services.development]
run = "pnpm --filter @workspace/qadeerbuilds run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qadeerbuilds", "run", "build" ]
serve = "static"
publicDir = "artifacts/qadeerbuilds/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20671"
BASE_PATH = "/"
