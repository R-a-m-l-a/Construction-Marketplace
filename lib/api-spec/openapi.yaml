openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: discovery
    description: Buildora discovery content
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [discovery]
      summary: List construction categories
      responses:
        "200":
          description: Construction categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /professionals/featured:
    get:
      operationId: listFeaturedProfessionals
      tags: [discovery]
      summary: List featured professionals
      responses:
        "200":
          description: Featured professionals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfessionalPreview"
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [discovery]
      summary: List featured marketplace products
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductPreview"
  /discovery/stats:
    get:
      operationId: getDiscoveryStats
      tags: [discovery]
      summary: Get homepage discovery stats
      responses:
        "200":
          description: Discovery stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryStats"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        group:
          type: string
        icon:
          type: string
        description:
          type: string
      required: [id, name, group, icon, description]
    ProfessionalPreview:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        city:
          type: string
        rating:
          type: number
        yearsExperience:
          type: integer
        verified:
          type: boolean
        source:
          type: string
        description:
          type: string
      required: [id, name, category, city, rating, yearsExperience, verified, source, description]
    ProductPreview:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        supplier:
          type: string
        city:
          type: string
        priceLabel:
          type: string
        description:
          type: string
      required: [id, name, category, supplier, city, priceLabel, description]
    DiscoveryStats:
      type: object
      properties:
        marketplaceItems:
          type: integer
        professionalCategories:
          type: integer
        citiesCovered:
          type: integer
        demoNotice:
          type: string
      required: [marketplaceItems, professionalCategories, citiesCovered, demoNotice]

