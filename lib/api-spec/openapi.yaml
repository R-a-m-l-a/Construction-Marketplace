openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marketplace
    description: QadeerBuilds material marketplace
  - name: discovery
    description: QadeerBuilds discovery content
  - name: locations
    description: Free-first map and nearby place discovery
  - name: estimates
    description: Deterministic construction cost estimates
  - name: projectBriefs
    description: Authenticated persisted project briefs
  - name: professionals
    description: Professional and service provider profiles
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products/{id}:
    get:
      operationId: getPublicProduct
      tags: [marketplace]
      summary: Get one public marketplace product with its supplier and category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A public product, its category and its public supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPublicProductResponse"
        "400":
          description: Malformed product id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to load product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /suppliers/{id}:
    get:
      operationId: getPublicSupplier
      tags: [marketplace]
      summary: Get one public supplier with their published products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A public supplier and their published products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPublicSupplierResponse"
        "400":
          description: Malformed supplier id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to load supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /suppliers/me/quotes:
    get:
      operationId: listMySupplierQuoteRequests
      tags: [marketplace]
      summary: List quote requests sent to the signed-in supplier
      responses:
        "200":
          description: Quote requests sent to the signed-in supplier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierQuoteRequest"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No supplier profile exists for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to load quote requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /suppliers/{id}/quote:
    post:
      operationId: createSupplierQuoteRequest
      tags: [marketplace]
      summary: Send a quote request to a supplier, optionally about one product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplierQuoteRequestBody"
      responses:
        "201":
          description: Quote request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierQuoteRequest"
        "400":
          description: Invalid quote request, product id, or unknown supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to submit quote request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /categories:
    get:
      operationId: listCategories
      tags: [marketplace]
      summary: List marketplace material categories
      responses:
        "200":
          description: Marketplace material categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceCategory"
        "500":
          description: Unable to load categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /products:
    get:
      operationId: listProducts
      tags: [marketplace]
      summary: List marketplace material products
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
          description: Free-text search across product name, description, unit, supplier, category, city and area. Multi-word queries match all words, and small spelling differences are tolerated when no exact match exists.
        - name: category
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: Filter by category id
        - name: city
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
          description: Filter by city
        - name: supplier
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: Filter by supplier id
      responses:
        "200":
          description: Marketplace products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductPreview"
        "400":
          description: Invalid category or supplier id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to load products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /professionals/featured:
    get:
      operationId: listFeaturedProfessionals
      tags: [discovery]
      summary: List the most recently created real professional profiles
      description: >-
        Phase 6D: database-backed. Returns real `professionals` rows newest
        first, using the same public read model as the discovery list, minus the
        contact fields. The endpoint returns an empty list when there are no
        professionals and never falls back to demo records. There is no
        `featured` column on the table, so "featured" is simply newest-first
        ordering rather than a manufactured flag.
      responses:
        "200":
          description: Real professional profiles, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfessionalPreview"
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [discovery]
      summary: List featured marketplace products
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductPreview"
  /discovery/stats:
    get:
      operationId: getDiscoveryStats
      tags: [discovery]
      summary: Get homepage discovery stats
      responses:
        "200":
          description: Discovery stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryStats"
  /locations/geocode:
    get:
      operationId: geocodeLocation
      tags: [locations]
      summary: Find a location by text
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: City, area, landmark, or address to search
      responses:
        "200":
          description: Geocoded location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResult"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Geocoding service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /locations/nearby:
    get:
      operationId: findNearbyPlaces
      tags: [locations]
      summary: Find nearby construction-related places
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: radiusMeters
          in: query
          required: false
          schema:
            type: integer
            minimum: 500
            maximum: 10000
            default: 5000
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Optional QadeerBuilds category filter
      responses:
        "200":
          description: Nearby places
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyPlacesResponse"
        "400":
          description: Invalid coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Nearby search service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /estimates:
    get:
      operationId: listConstructionEstimates
      tags: [estimates]
      summary: List the signed-in user's saved construction estimates
      responses:
        "200":
          description: Saved construction estimates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConstructionEstimate"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to load saved estimates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createConstructionEstimate
      tags: [estimates]
      summary: Save a construction estimate for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConstructionEstimateBody"
      responses:
        "201":
          description: Saved construction estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstructionEstimate"
        "400":
          description: Invalid estimate data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to save estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /project-briefs:
    get:
      operationId: listProjectBriefs
      tags: [projectBriefs]
      summary: List the signed-in user's saved project briefs
      responses:
        "200":
          description: Saved project briefs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectBrief"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to load project briefs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createProjectBrief
      tags: [projectBriefs]
      summary: Save a project brief for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBriefBody"
      responses:
        "201":
          description: Saved project brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBrief"
        "400":
          description: Invalid project brief data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to save project brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /professionals:
    get:
      operationId: listPublicProfessionals
      tags: [professionals]
      summary: List public professional profiles
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
          description: Free-text search across name, profession, category, services, city and area. Multi-word queries match all words, and small spelling differences are tolerated when no exact match exists.
        - name: city
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
          description: Filter by city
        - name: location
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: Filter by area or location
        - name: category
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
          description: Filter by trade category
        - name: services
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: Filter by offered services
      responses:
        "200":
          description: Public professional profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProfessional"
        "500":
          description: Unable to load professionals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createProfessional
      tags: [professionals]
      summary: Create the signed-in user's professional profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfessionalBody"
      responses:
        "201":
          description: Created professional profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"
        "400":
          description: Invalid professional data or profile already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to create professional profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /professionals/{id}:
    get:
      operationId: getPublicProfessional
      tags: [professionals]
      summary: Get one public professional profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A public professional profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfessional"
        "404":
          description: No such professional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to load professional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /professionals/me:
    get:
      operationId: getMyProfessional
      tags: [professionals]
      summary: Get the signed-in user's professional profile
      responses:
        "200":
          description: The signed-in user's professional profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No professional profile exists yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to load professional profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMyProfessional
      tags: [professionals]
      summary: Update the signed-in user's professional profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfessionalBody"
      responses:
        "200":
          description: Updated professional profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Professional"
        "400":
          description: Invalid professional data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No professional profile exists yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to update professional profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /professionals/me/projects:
    get:
      operationId: listMyProfessionalProjects
      tags: [professionals]
      summary: List the signed-in professional's portfolio projects
      responses:
        "200":
          description: The signed-in professional's portfolio projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfessionalProject"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No professional profile exists yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to load portfolio projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMyProfessionalProject
      tags: [professionals]
      summary: Add a portfolio project to the signed-in professional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfessionalProjectBody"
      responses:
        "201":
          description: Created portfolio project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalProject"
        "400":
          description: Invalid portfolio project data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No professional profile exists yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to create portfolio project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /professionals/me/projects/{id}:
    patch:
      operationId: updateMyProfessionalProject
      tags: [professionals]
      summary: Update one of the signed-in professional's portfolio projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfessionalProjectBody"
      responses:
        "200":
          description: Updated portfolio project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalProject"
        "400":
          description: Invalid portfolio project data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such portfolio project for the signed-in professional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to update portfolio project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMyProfessionalProject
      tags: [professionals]
      summary: Delete one of the signed-in professional's portfolio projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Portfolio project deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such portfolio project for the signed-in professional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to delete portfolio project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /professionals/me/quotes:
    get:
      operationId: listMyQuoteRequests
      tags: [professionals]
      summary: List quote requests sent to the signed-in professional
      responses:
        "200":
          description: Quote requests sent to the signed-in professional
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteRequest"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No professional profile exists yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to load quote requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /professionals/{id}/quote:
    post:
      operationId: createProfessionalQuoteRequest
      tags: [professionals]
      summary: Send a quote request to a professional
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequestBody"
      responses:
        "201":
          description: Quote request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"
        "400":
          description: Invalid quote request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such professional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to submit quote request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /professionals/{id}/projects:
    get:
      operationId: listPublicProfessionalProjects
      tags: [professionals]
      summary: List a professional's public portfolio projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public portfolio projects for a professional
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProfessionalProject"
        "404":
          description: No such professional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unable to load portfolio projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        group:
          type: string
        icon:
          type: string
        description:
          type: string
      required: [id, name, group, icon, description]
    ProfessionalPreview:
      type: object
      description: >-
        Phase 6D public preview of a real professional row. Mirrors the
        `PublicProfessional` read model used by professional discovery, except
        that `phone` and `whatsapp` are deliberately excluded: a listing preview
        is not a contact surface, and the Call and WhatsApp actions live on the
        public profile page. There is no `rating`, `yearsExperience` or
        `verified` field, because none of those exist on the real schema and
        manufacturing them would be inventing data.
      properties:
        id:
          type: string
        name:
          type: string
        profession:
          type: string
        category:
          type: string
        services:
          type: string
        city:
          type: string
        location:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
      required:
        [id, name, profession, category, services, city, location, logoUrl]
    PublicProduct:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]
        price:
          type: ["number", "null"]
          description: Price in PKR. Null means the supplier has not published a price.
        priceLabel:
          type: ["string", "null"]
          description: 'Rendered fallback for a null price: "Price on request".'
        city:
          type: string
        location:
          type: ["string", "null"]
